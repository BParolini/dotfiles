# Forca aplicativos baseados em Qt e GTK usarem Wayland nativo
QT_QPA_PLATFORM=wayland
GDK_BACKEND=wayland,x11

# Habilitasuporte a decodificacão de hardware correta para Firefox/Chromium
MOZ_ENABLE_WAYLAND=1
NVD_BACKEND=direct

# Configuracões de compatibilidade para XWayland (aplicativos antigos que não suportam wayland)
XDG_SESSION_TYPE=wayland

# Impede que aplicativos legados (XWayland) fiquem borrados em telas com escalas diferentes
KWIN_DRM_PREFER_COLOR_DEPTH=24
